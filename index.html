<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PBTI - 物理学家人格类型指示器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
        }

        .hidden {
            display: none !important;
        }

        /* 首页 */
        .start-screen {
            text-align: center;
            padding: 60px 20px;
        }

        .logo {
            font-size: 72px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .btn {
            padding: 16px 48px;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
        }

        /* 测试页面 */
        .test-screen {
            padding: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .question-number {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 10px;
        }

        .question {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 40px;
            line-height: 1.4;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .options {
            display: grid;
            gap: 16px;
        }

        .option {
            padding: 20px 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.9);
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }

        .option:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(102, 126, 234, 0.5);
            transform: translateX(10px);
        }

        .option.selected {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2));
            border-color: #667eea;
        }

        /* 结果页面 */
        .result-screen {
            text-align: center;
            padding: 40px;
        }

        .result-type {
            font-size: 56px;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .result-name {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .result-icon {
            font-size: 80px;
            margin: 30px 0;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        .result-description {
            font-size: 18px;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 30px;
        }

        .traits {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 30px;
        }

        .trait {
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            font-size: 14px;
        }

        .trait-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 4px;
        }

        .trait-value {
            font-weight: 600;
            color: #667eea;
        }

        .dimensions {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 40px;
        }

        .dimension {
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            font-size: 13px;
        }

        .dimension-letter {
            font-size: 24px;
            font-weight: 800;
            color: #667eea;
            margin-bottom: 4px;
        }

        .dimension-name {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
        }

        .famous-physicists {
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 16px;
        }

        .famous-physicists h4 {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 12px;
        }

        .famous-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .famous-tag {
            padding: 6px 14px;
            background: rgba(102, 126, 234, 0.3);
            border-radius: 20px;
            font-size: 13px;
        }

        .share-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            margin-top: 10px;
        }

        .share-btn:hover {
            box-shadow: 0 15px 40px rgba(245, 87, 108, 0.5);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 32px;
            }

            .question {
                font-size: 22px;
                min-height: 100px;
            }

            .traits {
                grid-template-columns: 1fr;
            }

            .dimensions {
                grid-template-columns: repeat(2, 1fr);
            }

            .result-type {
                font-size: 42px;
            }

            .result-name {
                font-size: 24px;
            }
        }
    </style>
</head>

        const dimensionNames = {
            'E': '实验型', 'T': '理论型',
            'M': '宏观', 'C': '微观',
            'L': '逻辑型', 'I': '直觉型',
            'O': '开放型', 'S': '结构型'
        };

        let currentQuestion = 0;
        let scores = { E: 0, T: 0, M: 0, C: 0, L: 0, I: 0, O: 0, S: 0 };

        function startTest() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('testScreen').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            const question = questions[currentQuestion];
            document.getElementById('questionNumber').textContent = `问题 ${currentQuestion + 1}/${questions.length}`;
            document.getElementById('question').textContent = question.q;
            document.getElementById('progressFill').style.width = `${((currentQuestion) / questions.length) * 100}%`;

            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = `
                <div class="option" onclick="selectAnswer('a')">${question.a}</div>
                <div class="option" onclick="selectAnswer('b')">${question.b}</div>
            `;
        }

        function selectAnswer(choice) {
            const dimension = dimensionMap[currentQuestion];
            if (choice === 'a') {
                scores[dimension]++;
            } else {
                const opposites = { 'E': 'T', 'T': 'E', 'M': 'C', 'C': 'M', 'L': 'I', 'I': 'L', 'O': 'S', 'S': 'O' };
                scores[opposites[dimension]]++;
            }

            currentQuestion++;
            if (currentQuestion < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('testScreen').classList.add('hidden');
            document.getElementById('resultScreen').classList.remove('hidden');

            // 计算结果
            const type = (scores.E >= scores.T ? 'E' : 'T') +
                        (scores.M >= scores.C ? 'M' : 'C') +
                        (scores.L >= scores.I ? 'L' : 'I') +
                        (scores.O >= scores.S ? 'O' : 'S');

            const result = personalityTypes[type];

            document.getElementById('resultType').textContent = type;
            document.getElementById('resultName').textContent = result.name;
            document.getElementById('resultIcon').textContent = result.icon;
            document.getElementById('resultDescription').textContent = result.description;

            // 显示维度
            const dimensionsDiv = document.getElementById('dimensions');
            dimensionsDiv.innerHTML = type.split('').map(d => `
                <div class="dimension">
                    <div class="dimension-letter">${d}</div>
                    <div class="dimension-name">${dimensionNames[d]}</div>
                </div>
            `).join('');

            // 显示特质
            const traitsDiv = document.getElementById('traits');
            traitsDiv.innerHTML = result.traits.map(t => `
                <div class="trait">
                    <div class="trait-label">${t.label}</div>
                    <div class="trait-value">${t.value}</div>
                </div>
            `).join('');

            // 显示著名物理学家
            const famousDiv = document.getElementById('famousPhysicists');
            famousDiv.innerHTML = result.famous.map(f => `<span class="famous-tag">${f}</span>`).join('');
        }

        function shareResult() {
            const type = document.getElementById('resultType').textContent;
            const name = document.getElementById('resultName').textContent;
            const text = `我的物理学家人格类型是 ${type} - ${name}！快来测测你是哪种物理学思维吧！`;

            if (navigator.share) {
                navigator.share({
                    title: 'PBTI 测试结果',
                    text: text
                });
            } else {
                navigator.clipboard.writeText(text);
                alert('结果已复制到剪贴板！');
            }
        }
